services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: research_graph_city
      POSTGRES_USER: research_graph_city
      POSTGRES_PASSWORD: research_graph_city
    ports:
      - "55432:5432"
    volumes:
      - research_graph_city_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_graph_city -d research_graph_city"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  research_graph_city_postgres:
